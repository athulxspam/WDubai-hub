/* Layout: one dark stage per page, shared header, accent colours swap per outlet via body[data-page]. */
:root{
  --bg:#0b0b0c; --ink:#f0eee2; --mute:rgba(240,238,226,.62); --line:rgba(240,238,226,.2);
  --a:#f0eee2; --b:#c9a86a; --tint:rgba(240,238,226,.06); --on-a:#0b0b0c;
  --font:"WSupreme","Futura","Avenir Next","Century Gothic",system-ui,sans-serif;
  color-scheme:dark;
}
body[data-page="ginger-moon"]{--bg:#1a0e09;--a:#ff8a4c;--b:#f2c98a;--tint:rgba(255,138,76,.09)}
body[data-page="attiko"]{--bg:#080a1a;--a:#c9a86a;--b:#9a86e6;--tint:rgba(201,168,106,.08)}
body[data-page="farrago"]{--bg:#0a1912;--a:#e86a4a;--b:#7fc29b;--tint:rgba(232,106,74,.09)}
body[data-page="viya-fit"]{--bg:#0c0e0f;--a:#d4f55a;--b:#6fd0ff;--tint:rgba(212,245,90,.07)}
body[data-page="blended"]{--bg:#1a120c;--a:#d9a77a;--b:#9aa072;--tint:rgba(217,167,122,.09)}
body[data-page="festive"]{--bg:#16080f;--a:#ffd37a;--b:#ff6b8b;--tint:rgba(255,211,122,.08)}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:400;font-size:16px;line-height:1.5;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  transition:background .7s ease;min-height:100vh;position:relative;overflow-x:hidden}
body::after{content:"";position:fixed;inset:0;pointer-events:none;z-index:2;opacity:.07;mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%' height='100%' filter='url(%23n)'/></svg>")}
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.wrap{position:relative;z-index:1;max-width:1180px;margin:0 auto}
a{color:inherit}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--a);outline-offset:3px}
h1,h2,h3{font-weight:600;text-transform:uppercase;letter-spacing:.03em;line-height:1;margin:0;text-wrap:balance}
.label{font-weight:500;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute)}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;padding-block:14px 12px;
  background:linear-gradient(var(--bg) 70%,transparent);display:flex;gap:14px 28px;align-items:center;flex-wrap:wrap;transition:background .7s}
header .logo{display:block;height:34px;flex:none}
header .logo img{height:100%;width:auto;display:block}
nav{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0;padding-block:2px}
nav::-webkit-scrollbar{display:none}
nav a{white-space:nowrap;text-decoration:none;font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  padding:9px 14px;border:1px solid transparent;color:var(--mute);transition:.2s}
nav a:hover{color:var(--ink);border-color:var(--line)}
nav a[aria-current="page"]{color:var(--on-a);background:var(--a);border-color:var(--a)}

body[data-page="home"] header .logo{display:none}
main{padding-block:26px 40px;animation:rise .6s cubic-bezier(.2,.7,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* home */
.hero{display:grid;gap:26px;padding-block:18px 8px}
.hero .big{width:min(620px,86%);height:auto;display:block}
.hero p.lead{max-width:46ch;color:var(--mute);font-size:clamp(16px,2.2vw,20px);margin:0}
.search{display:flex;align-items:center;gap:12px;border-bottom:1px solid var(--ink);max-width:560px;padding-bottom:8px}
.search input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:inherit;font-size:18px;outline:none;padding:6px 0}
.search input::placeholder{color:var(--mute)}
.stamp{display:flex;gap:12px;align-items:flex-start;max-width:640px;padding:12px 14px;border:1px solid var(--line);background:var(--tint)}
.stamp b{display:block;font-weight:500;font-size:15px}
.stamp .s{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.stamp .dot{margin-top:6px;flex:none}
.results{display:grid;gap:8px;max-width:760px}
.row{display:grid;grid-template-columns:auto 1fr auto;gap:6px 14px;align-items:center;text-decoration:none;
  padding:12px 14px;border:1px solid var(--line);background:var(--tint);cursor:pointer;text-align:left}
.row:hover{border-color:var(--ink)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--a))}
.row b{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:14px}
.row span.s{color:var(--mute);font-size:13px;display:block;font-weight:400;text-transform:none;letter-spacing:0}
.row .go{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute)}
section.blk{display:grid;gap:16px;margin-top:44px}
.blk>.head{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.blk h2{font-size:clamp(22px,3.4vw,34px)}
.today{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr));gap:10px}
.tiles{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}
.tile{grid-column:span 3;position:relative;text-decoration:none;display:flex;flex-direction:column;justify-content:space-between;gap:34px;
  min-height:230px;padding:20px;border:1px solid var(--line);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 16%,transparent),transparent 70%);
  transition:transform .3s,border-color .3s,background .3s;overflow:hidden;min-width:0}
.tile:hover{transform:translateY(-4px);border-color:var(--c);background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,transparent),transparent 80%)}
.tile.w6{grid-column:span 6}
.tile h3{font-size:clamp(24px,3vw,32px);color:var(--ink)}
.tile .top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.tile .th{width:58px;height:58px;object-fit:cover;opacity:.9;flex:none;filter:saturate(.9)}
.tile p{margin:8px 0 0;color:var(--mute);font-size:14px}
.tile .meta{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tile .arrow{font-size:22px;color:var(--c);transition:transform .3s}
.tile:hover .arrow{transform:translateX(6px)}
.count{font-weight:600;font-size:clamp(40px,6vw,64px);line-height:.9;color:var(--c)}
@media(max-width:900px){.tile{grid-column:span 6!important}.tile.w6{grid-column:span 12!important}}
@media(max-width:520px){.tile,.tile.w6{grid-column:span 12!important;min-height:190px}}

/* page head */
.ph{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,380px);gap:34px;align-items:end;padding-block:10px 8px}
.ph.solo{grid-template-columns:minmax(0,1fr)}
.ph h1{font-size:clamp(44px,10vw,118px);color:var(--ink)}
.ph h1 em{font-style:normal;color:var(--a)}
.ph .tag{margin:16px 0 0;font-size:clamp(16px,2vw,20px);color:var(--mute);max-width:48ch}
.facts{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:1px;background:var(--line);border:1px solid var(--line);margin-top:26px}
.fact{background:var(--bg);padding:14px 16px;display:grid;gap:4px;align-content:start;min-width:0;transition:background .7s}
.fact b{font-weight:500;font-size:15px;overflow-wrap:anywhere}
.fact .cp{justify-self:start;background:none;border:0;padding:0;color:var(--a);font-size:12px;letter-spacing:.12em;text-transform:uppercase;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.frame{margin:0;position:relative}
.frame img{width:100%;display:block;aspect-ratio:4/3;object-fit:cover;border:1px solid var(--line);cursor:zoom-in}
.frame figcaption{margin-top:8px}
@media(max-width:820px){.ph{grid-template-columns:minmax(0,1fr)}.frame{max-width:420px}}
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:24px}
.btn{display:inline-flex;align-items:center;gap:10px;text-decoration:none;cursor:pointer;font-weight:600;font-size:12px;letter-spacing:.16em;text-transform:uppercase;
  padding:13px 20px;border:1px solid var(--a);background:var(--a);color:var(--on-a);transition:.2s}
.btn:hover{background:transparent;color:var(--a)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--a);color:var(--a)}
body[data-page="blended"] .btn,body[data-page="viya-fit"] .btn,body[data-page="festive"] .btn,body[data-page="attiko"] .btn,body[data-page="ginger-moon"] .btn{--on-a:#0b0b0c}

/* filters */
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chipb{background:none;border:1px solid var(--line);padding:8px 14px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:500;cursor:pointer;color:var(--mute);transition:.2s}
.chipb:hover{color:var(--ink);border-color:var(--ink)}
.chipb[aria-pressed="true"],.chipb[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chipb.today{border-color:var(--a);color:var(--a)}

/* cards */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,360px),1fr));gap:12px}
.card{display:grid;grid-template-columns:minmax(0,1fr);padding:16px 18px;border:1px solid var(--line);background:var(--tint);
  --c:var(--a);transition:border-color .25s,transform .25s}
.card.go{cursor:pointer}
.card:hover{border-color:var(--c);transform:translateY(-2px)}
.thumb{padding:0;border:0;background:none;cursor:zoom-in;align-self:start;position:relative}
.thumb img{width:118px;height:118px;object-fit:cover;display:block;border:1px solid var(--line)}
.thumb.none{cursor:default;width:118px;height:118px;border:1px dashed var(--line);display:grid;place-items:center;color:var(--mute);font-size:11px;letter-spacing:.16em;text-transform:uppercase}
.cb{display:grid;gap:8px;align-content:start;min-width:0}
.cb h3{font-size:19px;line-height:1.08}
.pill{display:inline-block;font-weight:500;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;padding:4px 8px;border:1px solid var(--c);color:var(--c)}
.pill.f{background:var(--c);color:#0b0b0c}
.pill.now{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.cb .when{margin:0;font-size:14px;color:var(--ink);font-weight:500}
.cb .price{margin:0;font-size:14px;color:var(--c);font-weight:600}
.cb .desc{margin:0;font-size:14px;color:var(--mute)}
.cb .btn{justify-self:start;padding:10px 16px;margin-top:4px;--on-a:#0b0b0c;background:var(--c);border-color:var(--c)}
.cb .btn:hover{background:transparent;color:var(--c)}
.pills{display:flex;gap:6px;flex-wrap:wrap}


/* festive */
.dateblk{display:grid;grid-template-columns:150px minmax(0,1fr);gap:22px;padding-block:22px;border-top:1px solid var(--line)}
.dateblk .d{font-weight:600;font-size:clamp(54px,8vw,84px);line-height:.85;color:var(--a)}
.dateblk .d small{display:block;font-size:12px;letter-spacing:.2em;color:var(--mute);font-weight:500;margin-top:10px}
@media(max-width:640px){.dateblk{grid-template-columns:minmax(0,1fr)}}
.gap{border:1px dashed var(--line);padding:18px 20px;display:grid;gap:8px;background:var(--tint)}
.gap ul{margin:0;padding-left:18px;color:var(--mute);font-size:14px;display:grid;gap:4px}

/* directory */
.tbl{overflow-x:auto;border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;min-width:760px;font-size:14px}
th,td{text-align:left;padding:14px 16px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-weight:500;font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--mute)}
tr:last-child td{border-bottom:0}
td b{font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td .cp{background:none;border:0;color:var(--a);cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:13px;padding:0}

footer{position:relative;z-index:1;max-width:1180px;margin:0 auto;padding-block:26px 40px;border-top:1px solid var(--line);color:var(--mute);font-size:12.5px;display:flex;gap:10px 30px;justify-content:space-between;flex-wrap:wrap}
footer p{margin:0;max-width:70ch}

/* lightbox + toast */
#lb{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.86);display:grid;place-items:center;padding:24px;cursor:zoom-out}
#lb img{max-width:min(94vw,980px);max-height:84vh;display:block;border:1px solid var(--line)}
#lb button{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;background:none;border:1px solid var(--line);padding:10px 14px;font-size:12px;letter-spacing:.16em;text-transform:uppercase;cursor:pointer}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;z-index:30;background:var(--ink);color:var(--bg);padding:11px 18px;font-size:13px;letter-spacing:.08em;transition:.3s;pointer-events:none}
#toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}html{scroll-behavior:auto}}
</style>

    <a class="tile w6" href="#festive" style="--c:#ffd37a"><div class="top"><div><span class="label">Christmas · New Year's Eve</span><h3 style="margin-top:12px">Festive season</h3><p>Christmas Day Lunch, Christmas Sky Brunch, Midnight Magic, Euphoria NYE.</p></div><div style="text-align:right"><div class="count">${ch>0?ch:"0"}</div><span class="label">days to Christmas</span></div></div><div class="meta"><span class="label">${ch>0?nye+" days to New Year's Eve":"Festive dates passed"}</span><span class="arrow">→</span></div></a>
    <a class="tile w3" href="#week" style="--c:#f0eee2;grid-column:span 3"><div><span class="label">Day by day</span><h3 style="margin-top:12px">This week</h3></div><div class="meta"><span class="label">Pick any day</span><span class="arrow">→</span></div></a>
    <a class="tile w3" href="#directory" style="--c:#6fd0ff;grid-column:span 12;min-height:120px"><div><span class="label">Quick reference</span><h3 style="margin-top:12px">Directory</h3></div><div class="meta"><span class="label">Hours · phones</span><span class="arrow">→</span></div></a>
   </div></section>`}

function outlet(k){const O=OUT[k];const list=OFFERS.filter(o=>o.o===k);const first=O.name.split(" ");
  const hasF=list.some(o=>o.type==="Festive");
  const heroHtml="";
  const facts=O.hours.map(h=>`<div class="fact"><span class="label">${h[0]}</span>${h[1]==="@book"?`<a class="btn" style="justify-self:start;padding:9px 16px" href="${O.book}" target="_blank" rel="noopener">Book ↗</a>`:`<b>${h[1]}</b>`}</div>`).join("")+
   `<div class="fact"><span class="label">Phone</span><b>${O.phone}</b>${O.phone.startsWith("+")?`<button class="cp" data-copy="${O.phone}">Copy number</button>`:""}</div>
    <div class="fact"><span class="label">Location</span><b>King Salman Bin Abdulaziz Al Saud St, Dubai</b></div>`;
  return `<div class="ph solo"><div><span class="label">W Dubai – Mina Seyahi · ${esc(O.kind)}</span>
   <h1 style="margin-top:18px">${first.slice(0,-1).join(" ")} <em>${first.slice(-1)}</em></h1><p class="tag">${esc(O.tag)}</p>
   <div class="actions"><a class="btn" href="${O.book}" target="_blank" rel="noopener">${O.bookLabel} ↗</a><a class="btn ghost" href="${O.web}" target="_blank" rel="noopener">Official page ↗</a></div></div>${heroHtml}</div>
   <div class="facts">${facts}</div>
   <section class="blk"><div class="head"><h2>${k==="viya-fit"||k==="blended"?"Programmes & events":"What's on"}</h2>
    ${hasF?`<div class="chips" id="flt"><button class="chipb" aria-pressed="true" data-f="All">All</button><button class="chipb" aria-pressed="false" data-f="Recurring">Recurring</button><button class="chipb" aria-pressed="false" data-f="Festive">Festive</button></div>`:""}</div>
    <div class="grid" id="cards">${list.map(card).join("")}</div></section>
   <section class="blk"><div class="head"><h2>Good to know</h2></div><div class="gap"><ul>${O.notes.map(n=>`<li>${esc(n)}</li>`).join("")}</ul></div></section>`}

function festive(){const f=OFFERS.filter(o=>o.type==="Festive");const dates=[["2026-12-25","25","Fri · Dec"],["2026-12-26","26","Sat · Dec"],["2026-12-31","31","Thu · Dec"]];
  return `<div class="ph solo"><div><span class="label">W Dubai – Mina Seyahi · December 2026</span><h1 style="margin-top:18px">Festive <em>season</em></h1></div></div>
  <section class="blk">${dates.map(([iso,d,l])=>{const n=daysTo(iso);return `<div class="dateblk"><div class="d">${d}<small>${l.toUpperCase()} · ${n>0?n+" DAYS TO GO":n===0?"TODAY":"PASSED"}</small></div><div class="grid">${f.filter(o=>o.date===iso).map(card).join("")}</div></div>`}).join("")}</section>
  <section class="blk"><div class="head"><h2>To confirm</h2></div><div class="gap"><ul><li>Attiko Euphoria NYE: event time, age limit and inclusions are not published. Only the table prices are.</li><li>Farrago and VIYA Fit: no December festive programme is published yet.</li><li>Christmas Eve and other December dates: nothing published for the four spaces in this hub.</li></ul></div></section>`}

let wkDay=T.dow;
function week(){const order=[1,2,3,4,5,6,0];
  const day=order.map(d=>`<button class="chipb ${d===T.dow?"today":""}" role="tab" aria-selected="${d===wkDay}" data-day="${d}">${DN[d]}${d===T.dow?" · today":""}</button>`).join("");
  return `<div class="ph solo"><div><span class="label">All four spaces</span><h1 style="margin-top:18px">This <em>week</em></h1><p class="tag">Pick a day to see every recurring activation running across the hotel.</p></div></div>
  <section class="blk"><div class="chips" id="days" role="tablist">${day}</div><div class="grid" id="wk"></div></section>`}
function fillWeek(){const l=OFFERS.filter(o=>o.days.includes(wkDay)&&o.type==="Recurring").sort((a,b)=>a.time.localeCompare(b.time));
  $("#wk").innerHTML=l.length?l.map(o=>card(o,true)).join(""):'<p class="label">Nothing scheduled this day.</p>';
  document.querySelectorAll("#days .chipb").forEach(b=>b.setAttribute("aria-selected",+b.dataset.day===wkDay))}

function directory(){const rows=Object.entries(OUT).map(([k,O])=>`<tr><td><b>${O.name}</b><br><span class="label">${esc(O.kind)}</span></td><td>${O.hours.map(h=>h[0]+": "+(h[1]==="@book"?`<a href="${O.book}" target="_blank" rel="noopener">Book ↗</a>`:h[1])).join("<br>")}</td><td>${O.phone}${O.phone.startsWith("+")?`<br><button class="cp" data-copy="${O.phone}">Copy</button>`:""}</td><td><a href="${O.book}" target="_blank" rel="noopener">Book ↗</a><br><a href="#${k}">Open page</a></td></tr>`).join("");
  return `<div class="ph solo"><div><span class="label">Quick reference</span><h1 style="margin-top:18px"><em>Directory</em></h1><p class="tag">Hours, phone numbers and booking links for every space.</p></div></div>
  <section class="blk"><div class="tbl"><table><thead><tr><th>Space</th><th>Hours</th><th>Phone</th><th>Links</th></tr></thead><tbody>${rows}</tbody></table></div>
  <div class="gap"><span class="label">Address for all four</span><b style="font-weight:500">W Dubai – Mina Seyahi, King Salman Bin Abdulaziz Al Saud Street, Dubai</b></div></section>`}

/* router */
const V={home,festive,week,directory};
function route(id){id=id||location.hash.slice(1);if(!PAGES.some(p=>p[0]===id))id="home";
  document.body.dataset.page=id;
  $("#nav").innerHTML=PAGES.map(([k,l])=>`<a href="#${k}" ${k===id?'aria-current="page"':""}>${l}</a>`).join("");
  const v=$("#view");v.style.animation="none";v.offsetHeight;v.style.animation="";
  v.innerHTML=(V[id]||(()=>outlet(id)))();
  if(id==="week")fillWeek();
  if(id==="home")wireSearch();
  window.scrollTo(0,0);setMode(id)}
function wireSearch(){const q=$("#q"),r=$("#res");q.addEventListener("input",()=>{const s=q.value.trim().toLowerCase();
  if(!s){r.innerHTML="";return}
  const m=OFFERS.filter(o=>(o.name+" "+OUT[o.o].name+" "+o.desc+" "+o.price+" "+o.type+" "+daysText(o)+" "+(o.dl||"")+" "+o.time).toLowerCase().includes(s));
  r.innerHTML=m.length?m.map(rowOf).join(""):'<p class="label">Nothing matches. Try an outlet or a day.</p>'})}
document.addEventListener("click",e=>{
  const nv=e.target.closest('a[href^="#"]');if(nv){e.preventDefault();const id=nv.getAttribute("href").slice(1);try{history.replaceState(null,"","#"+id)}catch(_){}CUR=id;route(id);return}
  const z=e.target.closest("[data-zoom]");if(z){const d=document.createElement("div");d.id="lb";d.innerHTML=`<img src="img/${z.dataset.zoom}.jpg" alt=""><button>Close</button>`;d.onclick=()=>d.remove();document.body.appendChild(d);return}
  const c=e.target.closest("[data-copy]");if(c){const t=c.dataset.copy;const ok=()=>toast("Copied "+t);
    (navigator.clipboard?navigator.clipboard.writeText(t):Promise.reject()).then(ok,()=>{const i=document.createElement("input");i.value=t;document.body.appendChild(i);i.select();try{document.execCommand("copy");ok()}catch(_){toast(t)}i.remove()});return}
  const f=e.target.closest("[data-f]");if(f){document.querySelectorAll("[data-f]").forEach(b=>b.setAttribute("aria-pressed",b===f));
    const k=document.body.dataset.page,F=f.dataset.f;$("#cards").innerHTML=OFFERS.filter(o=>o.o===k&&(F==="All"||o.type===F)).map(card).join("");return}
  const g=e.target.closest("[data-go]");if(g&&!e.target.closest("a")){const id=g.dataset.go;try{history.replaceState(null,"","#"+id)}catch(_){}CUR=id;route(id);return}
  const d=e.target.closest("[data-day]");if(d){wkDay=+d.dataset.day;fillWeek()}});
document.addEventListener("keydown",e=>{if(e.key==="Escape")document.getElementById("lb")?.remove()});
let CUR="home";let tt;function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>t.classList.remove("on"),1800)}

/* animated backgrounds: one canvas, one scene per page */
const cv=$("#bg"),cx=cv.getContext("2d"),RM=matchMedia("(prefers-reduced-motion: reduce)").matches;
let W,H,DPR,mode="home",S=[],t0=0,mx=.5,my=.5,raf;
const rgb=h=>{h=h.replace("#","");return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]};
const rgba=(h,a)=>{const c=rgb(h);return`rgba(${c[0]},${c[1]},${c[2]},${a})`};
const COL={home:["#f0eee2","#ff8a4c","#c9a86a","#7fc29b"],"ginger-moon":["#ff8a4c","#f2c98a"],attiko:["#c9a86a","#9a86e6"],farrago:["#e86a4a","#7fc29b","#f0eee2"],"viya-fit":["#d4f55a","#6fd0ff"],blended:["#d9a77a","#9aa072"],festive:["#ffd37a","#ff6b8b"],week:["#f0eee2","#6fd0ff"],directory:["#f0eee2","#6fd0ff"]};
function size(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;cv.width=W*DPR;cv.height=H*DPR;cx.setTransform(DPR,0,0,DPR,0,0)}
function setMode(m){mode=m;S=[];const r=Math.random;
  if(m==="attiko")for(let i=0;i<150;i++)S.push({x:r(),y:r()*.8,s:r()*1.4+.3,p:r()*6.28,v:.5+r()*1.5});
  if(m==="festive"){for(let i=0;i<70;i++)S.push({x:r(),y:r(),s:r()*2+.6,v:.02+r()*.05,p:r()*6.28});S.burst=[];S.nb=0}
  if(m==="blended")for(let i=0;i<26;i++)S.push({x:r(),y:r(),s:7+r()*11,v:.018+r()*.03,p:r()*6.28,rot:r()*6.28,vr:(r()-.5)*.012});
  if(m==="attiko")S.shoot=[];
  cancelAnimationFrame(raf);t0=performance.now();RM?frame(t0+4000):loop()}
function loop(){frame(performance.now());raf=requestAnimationFrame(loop)}
function glow(x,y,rad,col,a){const g=cx.createRadialGradient(x,y,0,x,y,rad);g.addColorStop(0,rgba(col,a));g.addColorStop(1,rgba(col,0));cx.fillStyle=g;cx.fillRect(x-rad,y-rad,rad*2,rad*2)}
function frame(now){const t=(now-t0)/1000,c=COL[mode]||COL.home;cx.clearRect(0,0,W,H);
  const px=(mx-.5)*24,py=(my-.5)*24;
  if(mode==="home"||mode==="week"||mode==="directory"){
    c.forEach((col,i)=>glow(W*(.5+.38*Math.sin(t*.07+i*1.7))+px,H*(.45+.32*Math.cos(t*.09+i*2.1))+py,Math.max(W,H)*(.38+.06*i),col,i?.07:.09))}
  else if(mode==="ginger-moon"){const hz=H*.62;glow(W*.74+px,hz-H*.05,Math.max(W,H)*.5,c[0],.28);
    cx.fillStyle=rgba(c[1],.55);cx.beginPath();cx.arc(W*.74+px,hz-H*.05,Math.min(W,H)*.16,0,6.28);cx.fill();
    for(let i=0;i<16;i++){const y=hz+i*i*2.4+i*8,al=.05+.1*(1-i/16);cx.strokeStyle=rgba(i%3?c[1]:c[0],al);cx.lineWidth=1;cx.beginPath();
      for(let x=0;x<=W;x+=14){const yy=y+Math.sin(x*.006+t*.5+i)*(3+i*.9);x?cx.lineTo(x,yy):cx.moveTo(x,yy)}cx.stroke()}}
  else if(mode==="attiko"){glow(W*.25,H*.2,W*.6,c[1],.08);glow(W*.85,H*.5,W*.5,c[0],.06);
    S.forEach(s=>{const a=.25+.6*(.5+.5*Math.sin(t*s.v+s.p));cx.fillStyle=rgba(c[0],a);cx.beginPath();cx.arc(s.x*W+px*s.s*.3,s.y*H+py*s.s*.3,s.s,0,6.28);cx.fill()});
    if(S.shoot&&Math.random()<.012)S.shoot.push({x:Math.random()*W,y:Math.random()*H*.4,l:0});
    S.shoot=(S.shoot||[]).filter(s=>s.l<1);S.shoot.forEach(s=>{s.l+=.02;const x=s.x+s.l*260,y=s.y+s.l*130;const g=cx.createLinearGradient(x-90,y-45,x,y);g.addColorStop(0,rgba(c[0],0));g.addColorStop(1,rgba("#ffffff",.9*(1-s.l)));cx.strokeStyle=g;cx.lineWidth=1.6;cx.beginPath();cx.moveTo(x-90,y-45);cx.lineTo(x,y);cx.stroke()})}
  else if(mode==="farrago"){const z=110;for(let gx=-1;gx<W/z+2;gx++)for(let gy=-1;gy<H/z+2;gy++){const cxp=gx*z+(gy%2?z/2:0)+px*1.5,cyp=gy*z*.8+py*1.5;
      const w=Math.sin(t*.5+gx*.6+gy*.8),a=.035+.07*(.5+.5*w),col=c[(gx+gy*2+9)%3];
      cx.save();cx.translate(cxp,cyp);cx.rotate(w*.12);cx.fillStyle=rgba(col,a);cx.beginPath();cx.moveTo(0,-z*.36);cx.lineTo(z*.22,0);cx.lineTo(0,z*.36);cx.lineTo(-z*.22,0);cx.closePath();cx.fill();cx.restore()}
    glow(W*.2,H*.9,W*.5,c[1],.1)}
  else if(mode==="blended"){
    glow(W*(.22+.05*Math.sin(t*.06))+px,H*(.25+.04*Math.cos(t*.08))+py,Math.max(W,H)*.5,c[1],.10);
    glow(W*(.85+.04*Math.cos(t*.05))+px,H*(.8+.05*Math.sin(t*.07))+py,Math.max(W,H)*.45,c[0],.07);
    for(let k=0;k<3;k++){cx.strokeStyle=rgba(c[1],.07);cx.lineWidth=14+k*6;cx.lineCap="round";cx.beginPath();const bx=W*(.18+k*.32)+Math.sin(t*.1+k)*40;
      for(let y=H;y>=-20;y-=14){const x=bx+Math.sin(y*.006+t*.28+k*2)*(26+(H-y)*.05);y===H?cx.moveTo(x,y):cx.lineTo(x,y)}cx.stroke()}
    cx.lineCap="butt";
    S.forEach(s=>{s.y+=s.v*.004;s.rot+=s.vr;if(s.y>1.05){s.y=-.05;s.x=Math.random()}
      const x=s.x*W+Math.sin(t*.3+s.p)*34+px*.5,y=s.y*H,col=c[Math.floor(s.p*3)%2];
      cx.save();cx.translate(x,y);cx.rotate(s.rot);cx.fillStyle=rgba(col,.13+.08*Math.sin(t*.5+s.p));cx.beginPath();cx.ellipse(0,0,s.s,s.s*.38,0,0,6.28);cx.fill();
      cx.strokeStyle=rgba(col,.2);cx.lineWidth=1;cx.beginPath();cx.moveTo(-s.s,0);cx.lineTo(s.s,0);cx.stroke();cx.restore()})}
  else if(mode==="viya-fit"){const ox=W*.82+px,oy=H*.18+py;for(let i=0;i<7;i++){const p=((t*.12+i/7)%1),rad=p*Math.max(W,H)*1.1;cx.strokeStyle=rgba(i%2?c[1]:c[0],.22*(1-p));cx.lineWidth=1.5;cx.beginPath();cx.arc(ox,oy,rad,0,6.28);cx.stroke()}
    cx.strokeStyle=rgba(c[0],.05);cx.lineWidth=1;for(let i=-10;i<40;i++){const x=((i*70+t*20)%(W+700))-350;cx.beginPath();cx.moveTo(x,H);cx.lineTo(x+H*.6,0);cx.stroke()}
    glow(ox,oy,Math.max(W,H)*.35,c[0],.08)}
  else if(mode==="festive"){glow(W*.5,H*.1,W*.7,c[1],.07);glow(W*.15,H*.8,W*.5,c[0],.07);
    S.forEach(s=>{s.y=(s.y+s.v*.004)%1;const a=.3+.5*Math.sin(t*2+s.p);cx.fillStyle=rgba(c[0],Math.max(0,a)*.7);cx.beginPath();cx.arc(s.x*W,s.y*H,s.s,0,6.28);cx.fill()});
    if(S.burst&&t>S.nb){S.nb=t+1.6+Math.random()*1.4;const bx=Math.random()*W,by=H*(.12+Math.random()*.4),col=c[Math.random()<.5?0:1];for(let i=0;i<46;i++){const an=i/46*6.28,sp=1.2+Math.random()*2.4;S.burst.push({x:bx,y:by,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,l:1,col})}}
    S.burst=(S.burst||[]).filter(p=>p.l>0);S.burst.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.025;p.vx*=.985;p.l-=.011;cx.fillStyle=rgba(p.col,Math.max(0,p.l));cx.beginPath();cx.arc(p.x,p.y,1.6,0,6.28);cx.fill()})}}
addEventListener("resize",()=>{size();if(RM)frame(performance.now()+4000)});
addEventListener("pointermove",e=>{mx=e.clientX/innerWidth;my=e.clientY/innerHeight},{passive:true});
addEventListener("hashchange",()=>route());
size();route();
</script>
</body></html>
